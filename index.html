<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tabStyle.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Aluno.js" defer></script>
    <script src="Turma.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="Utils.js" defer></script>
    <script src="main.js" defer></script>
    <title>Sistema Escolar</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button
        class="tab-button active"
        id="btn-cadastrar-turma"
        onclick="Interface.cadastrarTurma()"
      >
        Cadastrar Turma
      </button>
      <button
        class="tab-button"
        id="btn-cadastrar"
        onclick="Interface.cadastrar()"
      >
        Listar Turmas
      </button>
      <button
        class="tab-button"
        id="btn-listar"
        onclick="Interface.listarAluno()"
      >
        Listar Alunos
      </button>
    </div>

    <!-- Conteúdo da Aba 1: Cadastrar Turma -->
    <div id="tab-cadastrar-turma" class="tab-content active">
      <h3>Cadastro de Turma</h3>
      Curso: <input id="curso" type="text"/>
      Professor: <input id="nomeProfessor" type="text"/>
      <button onclick="Interface.btnSalvar()" class="btn-salvar">
      Salvar
      </button>
    </div>

    <!-- Conteúdo da Aba 2: Turmas -->
    <div id="tab-cadastrar" class="tab-content">
      <h3>Turmas</h3>
      <ul class="lista-turmas" id="turmas">
        <li>Nenhuma Turma Cadastrada ainda</li>
      </ul>
      <h3>Cadastrar Aluno</h3>
      Nome do Aluno: <input id="nome" type="text" />
      <button onclick="Interface.btnSalvar()" class="btn-salvar">
        Salvar
      </button>
    </div>

    <!-- Conteúdo da Aba 3: Listar Alunos na turma -->
    <div id="tab-listar" class="tab-content">
      <b>Alunos Cadastrados na Turma</b>
      <ul class="lista-alunos" id="alunos">
        <!-- O JavaScript vai colocar os alunos aqui depois -->
        <li>Nenhum aluno cadastrado ainda.</li>
      </ul>
    </div>
  </body>
</html>
